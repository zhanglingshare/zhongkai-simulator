name: V3 Workbench Browser Smoke
on:
  push:
    branches:
      - "main"
      - "chatgpt/v3.*"
    paths:
      - "v3/**"
      - ".github/workflows/v3-browser-smoke.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/v3-browser-smoke.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chinese fonts for visual verification
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install test harness
        run: npm install --no-save --no-audit --no-fund playwright
      - name: V3.22 real graph entrance timing and no-mutation tests
        run: node v3/tests/visual-entry.spec.cjs
      - name: Story-only release scope and unchanged other versions
        run: node v3/tests/story-scope.spec.cjs
      - name: V3.23 named exit and same-time original-model snapshot truth
        run: node v3/tests/home-story.spec.cjs
      - name: V3.22 direct manipulation and same-snapshot Chrome acceptance
        run: node v3/tests/visual-interaction-smoke.cjs
      - name: Evidence validation unit tests
        run: node v3/tests/validation.spec.cjs
      - name: Historic observation integrity and calibration gate tests
        run: node v3/tests/observations.spec.cjs
      - name: Past-only reconstructed baseline unit tests
        run: node v3/tests/benchmark.spec.cjs
      - name: Model-to-observation measurement and no-leakage tests
        run: node v3/tests/measurement.spec.cjs
      - name: Risk/growth reproducible public scenario link tests
        run: node v3/tests/explore.spec.cjs
      - name: Real Sim holographic topology and 3D projection tests
        run: node v3/tests/holo.spec.cjs
      - name: V3.9 model-only impact lens unit tests
        run: node v3/tests/impact.spec.cjs
      - name: Full model-subject atlas data and provenance tests
        run: node v3/tests/atlas.spec.cjs
      - name: V3.11 lab browser interactions and responsive overflow checks
        run: node v3/tests/lab-v311-smoke.cjs
      - name: V3.12 dynamic evolution and reduced-motion browser tests
        run: node v3/tests/v312-motion-smoke.cjs
      - name: V3.13 inflow research unit tests
        run: node v3/tests/inflow.spec.cjs
      - name: V3.13 inflow lab Chrome acceptance
        run: node v3/tests/inflow-smoke.cjs
      - name: V3.14 public company search unit tests
        run: node v3/tests/company-assist.spec.cjs
      - name: V3.15 Chinese search and Zhongkai case contracts
        run: node v3/tests/company-china.spec.cjs
      - name: V3.15 China-based enterprise case Chrome acceptance
        run: node v3/tests/company-assist-smoke.cjs
      - name: V3.16 Chinese-source dossier and scenario gate unit tests
        run: node v3/tests/company-dossier.spec.cjs
      - name: V3.16 source-bound research Chrome acceptance
        run: node v3/tests/company-dossier-smoke.cjs
      - name: V3.17 multi-source enterprise audit and synthetic 20-company fixtures
        run: node v3/tests/company-investigation.spec.cjs
      - name: V3.17 licensed China API backend secure adapter mocks
        run: node v3/tests/company-investigation-server.spec.mjs
      - name: V3.17 company investigation Chrome E2E
        run: node v3/tests/company-investigation-smoke.cjs
      - name: V3.18 incremental economy and 20 real-company evidence unit tests
        run: node v3/tests/economic-impact.spec.cjs
      - name: V3.18 scenario economics and source ledger Chrome mobile acceptance
        run: node v3/tests/economic-impact-smoke.cjs
      - name: V3.19 exact decision thresholds and 20-source diligence boundary tests
        run: node v3/tests/decision-reversal.spec.cjs
      - name: V3.19 decision inversion Chrome desktop and mobile E2E
        run: node v3/tests/decision-reversal-smoke.cjs
      - name: V3.20 scientific trust audit and preregistration boundary tests
        run: node v3/tests/trust-audit.spec.cjs
      - name: V3.20 20-entity evidence trust dashboard Chrome desktop and mobile
        run: node v3/tests/trust-audit-smoke.cjs
      - name: V3.20 independent public V3.19 Pages access check
        run: node v3/tests/v319-public-pages-check.mjs
      - name: V3.21 real-source pilot audit, contradictory evidence, guarded economics and append-only snapshot tests
        run: node v3/tests/pilot-closure.spec.cjs
      - name: V3.21 five-company validation loop Chrome desktop and mobile acceptance
        run: node v3/tests/pilot-closure-smoke.cjs
      - name: V3.21 ensure prior Git source snapshots cannot be rewritten
        if: github.event_name == 'pull_request'
        env:
          V321_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: node v3/scripts/check-snapshot-history.cjs
      - name: V3.21 independently verify previous V3.20 live GitHub Pages
        run: node v3/tests/v320-public-pages-check.mjs
      - name: V3.21 presentation-only immersion, onboarding, narrative and mobile readability
        run: node v3/tests/experience-polish-smoke.cjs
      - name: Named industrial role story uses only real A/B model states
        run: node v3/tests/role-story.spec.cjs
      - name: Story-first one-click actual Sim and accessible research desktop/mobile browser acceptance
        run: node v3/tests/story-first-smoke.cjs
      - name: Public project introduction launch links and distinct legacy classic V3 Chrome acceptance
        run: node v3/tests/launch-entries-smoke.cjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-browser-screenshots
          path: v3/screenshots/
          if-no-files-found: ignore
          retention-days: 7
