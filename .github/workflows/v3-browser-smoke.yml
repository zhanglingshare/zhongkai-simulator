name: V3 Workbench Browser Smoke
on:
  push:
    branches:
      - "chatgpt/v3.*"
    paths:
      - "v3/**"
      - ".github/workflows/v3-browser-smoke.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/v3-browser-smoke.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chinese fonts for visual verification
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install test harness
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Evidence validation unit tests
        run: node v3/tests/validation.spec.cjs
      - name: Historic observation integrity and calibration gate tests
        run: node v3/tests/observations.spec.cjs
      - name: Browser interactions and responsive overflow checks
        run: node v3/tests/smoke.cjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-browser-screenshots
          path: v3/screenshots/
          if-no-files-found: ignore
          retention-days: 7
