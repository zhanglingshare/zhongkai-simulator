<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据血统 · 仲恺产业风洞</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23312e81'/%3E%3C/svg%3E">
<link rel="stylesheet" href="model.css">
</head>
<body>
<header class="top"><h1>🏭 仲恺产业风洞 <span class="ver">v0.9.0</span><span class="muted" style="font-weight:400">数据血统 · 导入世界</span></h1></header>
<nav style="display:flex;gap:8px;padding:10px 28px;max-width:1600px;margin:0 auto;flex-wrap:wrap">
  <a href="index.html" style="font-size:13px;color:#64748b;text-decoration:none">主推演</a>
  <a href="gates.html" style="font-size:13px;color:#64748b;text-decoration:none">验模三门</a>
  <a href="montecarlo.html" style="font-size:13px;color:#64748b;text-decoration:none">蒙特卡洛</a>
  <a href="sensitivity.html" style="font-size:13px;color:#64748b;text-decoration:none">敏感性</a>
  <a href="interviews.html" style="font-size:13px;color:#64748b;text-decoration:none">访谈</a>
  <a href="reports.html" style="font-size:13px;color:#64748b;text-decoration:none">决策档案</a>
  <a href="data.html" style="font-size:13px;color:#087f8c;font-weight:600;text-decoration:none">数据血统</a>
</nav>
<div class="wrap" style="grid-template-columns:1fr;max-width:900px">
  <div class="card">
    <h2>🧬 数据血统与边界</h2>
    <div id="data-lineage" class="muted"></div>
    <h2 style="margin-top:12px">📄 本局报告</h2>
    <div id="report-locknote" class="locknote">🔒 未过验模三门，报告锁定。</div>
    <div id="report-box" class="locked-report"></div>
  </div>
  <div class="card">
    <h2>📥 导入世界 <span class="tag">把模拟器从「仲恺基准」变成你的区域</span></h2>
    <div class="muted" style="margin-bottom:6px">支持 CSV / JSON / TXT 报告。仲恺基准永远在，导入只是换世界。</div>
    <input type="file" id="up-file" accept=".csv,.json,.txt,.tsv" style="margin-bottom:6px">
    <textarea id="up-text" rows="6" placeholder="…或在此粘贴文件内容"></textarea>
    <div class="row">
      <button class="btn primary" id="btn-parse">解析预览</button>
      <button class="btn" id="btn-sample">填入示例</button>
      <span class="muted" id="up-status"></span>
    </div>
    <div id="up-preview"></div>
    <div class="row" style="margin-top:8px">
      <label class="muted">世界种子</label>
      <input type="number" id="up-seed" value="7" style="width:70px">
      <button class="btn primary" id="btn-build">生成世界</button>
      <button class="btn" id="btn-restore">恢复仲恺基准</button>
      <button class="btn" id="btn-export-seed">导出当前世界种子</button>
    </div>
    <div class="muted" id="up-note" style="margin-top:6px"></div>
  </div>
</div>
<footer>数据来源：仲恺高新区统计公报 / 管委会工作报告（2025）。License: MIT。</footer>
<script src="model.js"></script>
</body>
</html>
