<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仲恺各镇生活 · 仲恺产业协同实验室</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23087f8c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="model.css">
<style>
  .pulse-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .pulse-box h3{font-size:14px;margin:0 0 10px;color:var(--sub)}
  .pulse-box li{font-size:14px;line-height:1.7;margin-bottom:6px}
  .town{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px;border-left:4px solid #087f8c}
  .town .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .town h3{font-size:18px;margin:0}
  .town .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#f0f9ff;color:#087f8c;font-weight:600}
  .town .level{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .level.high{background:#fef2f2;color:#c24141}
  .level.mid{background:#fffbeb;color:#b45309}
  .town .why{font-size:13px;color:var(--sub);line-height:1.6;margin:6px 0 10px}
  .town .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  @media(max-width:600px){.town .cols{grid-template-columns:1fr}}
  .town .col h4{font-size:12px;color:var(--sub);margin:0 0 4px}
  .town .col li{font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header class="top" style="padding:16px 28px 12px">
  <h1>🏘 仲恺各镇生活 <span class="ver">v1.0</span></h1>
</header>
<nav style="display:flex;gap:8px;padding:10px 28px;max-width:900px;margin:0 auto;flex-wrap:wrap">
  <a href="index.html" style="font-size:13px;color:#64748b;text-decoration:none">← 概览</a>
  <a href="today.html" style="font-size:13px;color:#64748b;text-decoration:none">今日仲恺</a>
  <a href="towns.html" style="font-size:13px;color:#087f8c;font-weight:600;text-decoration:none">各镇生活</a>
  <a href="run.html" style="font-size:13px;color:#64748b;text-decoration:none">动态推演</a>
</nav>
<div style="max-width:900px;margin:0 auto;padding:0 28px">
  <div id="loading" class="muted" style="padding:40px;text-align:center">正在拉取各镇数据…</div>
  <div id="content" style="display:none">
    <div class="muted" style="font-size:13px;margin-bottom:12px" id="updated-lbl"></div>

    <div class="pulse-box">
      <h3>📡 这两天仲恺人的朋友圈在刷</h3>
      <ul id="pulse"></ul>
    </div>

    <h2 style="font-size:18px;margin:20px 0 12px">5 镇街 · 烟火生活</h2>
    <div id="towns"></div>

    <div class="muted" style="font-size:12px;margin:20px 0;line-height:1.6" id="note"></div>
  </div>
</div>
<footer>去处人气按近期公开打卡热度分档，非真实人数统计。来源：政府公开信息 · 南方+/惠州日报 · 点评/小红书/抖音公开打卡。</footer>
<script>
fetch('life.json').then(r=>{
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}).then(d=>{
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
  document.getElementById('updated-lbl').textContent='更新于 '+(d.updated||'')+' · 每日更新一次';
  document.getElementById('note').textContent=d.note||'';
  // pulse
  const p=document.getElementById('pulse');
  (d.pulse||[]).forEach(x=>{p.innerHTML+=`<li>${x}</li>`;});
  // towns
  const t=document.getElementById('towns');
  (d.towns||[]).forEach(tn=>{
    const lvCls=tn.level==='高'?'high':'mid';
    let foods=tn.foods&&tn.foods.length?tn.foods.map(f=>`<li>${f}</li>`).join(''):'<li>—</li>';
    let plays=tn.plays&&tn.plays.length?tn.plays.map(x=>`<li>${x}</li>`).join(''):'<li>—</li>';
    t.innerHTML+=`<div class="town">
      <div class="head">
        <h3>${tn.n}</h3>
        <span class="tag">${tn.tag||''}</span>
        <span class="level ${lvCls}">人气${tn.level||'中'}</span>
      </div>
      <div class="why">${tn.why||''}</div>
      <div class="cols">
        <div class="col"><h4>🍜 吃什么</h4><ul>${foods}</ul></div>
        <div class="col"><h4>📍 去哪玩</h4><ul>${plays}</ul></div>
      </div>
    </div>`;
  });
}).catch(e=>{
  document.getElementById('loading').innerHTML='<b>数据加载失败</b><br><span style="font-size:13px">'+e.message+'<br>稍后刷新试试。</span>';
});
</script>
</body>
</html>
