<div class="wrap" style="grid-template-columns:1fr;max-width:900px">
  <div class="card">
    <h2>🌪 敏感性排序 <span class="tag">哪个变量一动，结论就翻</span></h2>
    <div class="muted">对每个关键变量做 ±扰动，用同源内核重跑多局，比较"景气/存续"的变化幅度，按敏感度从大到小排序。</div>
    <div class="row">
      <label class="muted">每档局数</label>
      <input type="number" id="sens-n" value="40" min="10" style="width:80px">
      <label class="muted">扰动幅度</label>
      <input type="number" id="sens-delta" value="0.15" step="0.05" style="width:80px">
      <button class="btn primary" id="btn-sens">运行敏感性分析</button>
    </div>
    <div id="sens-progress" class="muted"></div>
    <div id="sens-results"></div>
  </div>
</div>
